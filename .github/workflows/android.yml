name: Android build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and assemble
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease
      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/rainy-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/rainy-release-unsigned.apk
          printf 'Commit %s\nRef %s\n' "$GITHUB_SHA" "$GITHUB_REF" > dist/build.txt
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rainy-android
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-*
